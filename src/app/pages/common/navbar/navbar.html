<!-- Backdrop for mobile -->
<div
  *ngIf="extras.isSidebarOpen()"
  class="fixed inset-0 bg-black/40 z-40 lg:hidden"
  (click)="extras.closeSidebar()">
</div>

<!-- Sidebar -->
<aside
  class="fixed top-0 left-0 h-screen bg-navbar border-r border-gray-200 z-50
         w-[85vw] max-w-72
         transform transition-transform duration-300 ease-in-out
         lg:max-w-none lg:translate-x-0"
  [ngClass]="[
    extras.isSidebarOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0',
    extras.isSidebarCollapsed() ? 'lg:w-20' : 'lg:w-64'
  ]">

  <!-- Header -->
  <div class="h-16 flex items-center justify-between px-4 sm:px-6 border-b border-navbar-border gap-2">
    <div class="flex items-center gap-2 min-w-0" [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:w-full' : ''">
      <img
        src="pharmacy-mark.svg"
        alt="Pharmacy Web logo"
        class="size-10 shrink-0 rounded-xl shadow-sm" />
      <p
        class="font-bold text-base sm:text-lg tracking-tight text-sidebar-foreground truncate"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">
        Pharmacy Web
      </p>
    </div>

    <div class="flex items-center gap-2" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">

      <button
      class="lg:hidden inline-flex items-center justify-center size-9 rounded-md hover:bg-gray-100"
      (click)="extras.closeSidebar()"
      aria-label="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>


  </div>

  <!-- Nav -->
  <div class="flex flex-col h-[calc(100vh-60px)]">
    <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

      <a *ngIf="checker('dashboard')"
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-layout-dashboard w-5 h-5 fill-current shrink-0">
          <rect width="7" height="9" x="3" y="3" rx="1"></rect>
          <rect width="7" height="5" x="14" y="3" rx="1"></rect>
          <rect width="7" height="9" x="14" y="12" rx="1"></rect>
          <rect width="7" height="5" x="3" y="16" rx="1"></rect>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Dashboard</span>
      </a>

      <a *ngIf="checker('sales')"
        routerLink="/sales"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-shopping-cart w-5 h-5 shrink-0">
          <circle cx="8" cy="21" r="1"></circle>
          <circle cx="19" cy="21" r="1"></circle>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Sales POS</span>
      </a>

      <a *ngIf="checker('claims')"
        routerLink="/hmo-philhealth"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-file-badge w-5 h-5 shrink-0">
          <path d="M12 22h6a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"></path>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
          <path d="M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
          <path d="M4.5 14.5 3 21l2-1 2 1-1.5-6.5"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Claims</span>
      </a>

      <a *ngIf="checker('sms')"
        routerLink="/offline-orders"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-message-square w-5 h-5 shrink-0">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Offline Orders (SMS)</span>
      </a>

      <a *ngIf="checker('inventory')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/inventory"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-package w-5 h-5 shrink-0">
          <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path>
          <path d="M12 22V12"></path>
          <polyline points="3.29 7 12 12 20.71 7"></polyline>
          <path d="m7.5 4.27 9 5.15"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Inventory</span>
      </a>

      <a *ngIf="checker('fefo')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/fefo"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-pill w-5 h-5 shrink-0">
          <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
          <path d="m8.5 8.5 7 7"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Batch &amp; FEFO</span>
      </a>

      <a *ngIf="checker('drugs')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/controlled-drugs"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-shield-alert w-5 h-5 shrink-0">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Controlled Drugs</span>
      </a>

      <a *ngIf="checker('delivery')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/delivery"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-truck w-5 h-5 shrink-0">
          <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
          <path d="M15 18H9"></path>
          <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
          <circle cx="17" cy="18" r="2"></circle>
          <circle cx="7" cy="18" r="2"></circle>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Delivery</span>
      </a>

      <a *ngIf="checker('reports')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/reports"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-file-text w-5 h-5 shrink-0">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
          <path d="M10 9H8"></path>
          <path d="M16 13H8"></path>
          <path d="M16 17H8"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Reports</span>
      </a>

      <a *ngIf="checker('users')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/users"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-users w-5 h-5 shrink-0">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Users</span>
      </a>

      <a *ngIf="checker('settings')"
        class="navbar-button"
        [ngClass]="extras.isSidebarCollapsed() ? 'lg:justify-center lg:px-0' : ''"
        routerLink="/settings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="lucide lucide-settings w-5 h-5 shrink-0">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span class="truncate" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Settings</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-navbar-border bg-navbar" [ngClass]="extras.isSidebarCollapsed() ? 'lg:px-3' : ''">
      <div class="bg-gray-100 p-3 text-sm rounded-md" [ngClass]="extras.isSidebarCollapsed() ? 'lg:text-center' : ''">
        <p class="font-medium text-sidebar-foreground truncate">
          <span [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">
            {{extras.formatRole(this.userData.data.role)}}
          </span>
          <span [ngClass]="extras.isSidebarCollapsed() ? 'hidden lg:inline' : 'hidden'">
            {{extras.formatRole(this.userData.data.role?.charAt(0) || '')}}
          </span>
        </p>
        <p class="text-muted-foreground text-xs mt-1" [ngClass]="extras.isSidebarCollapsed() ? 'lg:hidden' : ''">Logged in securely</p>
      </div>
    </div>
  </div>
</aside>
